[project]
name = "dropout-risk"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Axel Alamilla" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dropout-risk = "dropout_risk:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.163.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "notebook>=7.6.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]
